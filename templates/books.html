<!DOCTYPE html>
<html>
<head>
    <title>Library Books</title>
</head>
<body>
    <h1>Books</h1>
    <ul>
        {% for book in books %}
        <li>
            <a href="{{ url_for('book_detail', book_id=book.id) }}">
                {{ book.title }}
            </a>
            - {{ book.author }}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
